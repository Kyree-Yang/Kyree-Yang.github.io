<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Temporarily offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf8;
        --fg: #1c1a17;
        --muted: #6b6660;
        --rule: #e2ddd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120f;
          --fg: #f0ece6;
          --muted: #9a938a;
          --rule: #2c2823;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font: 400 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 32rem; }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p { margin: 0 0 1.25rem; color: var(--muted); }
      hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
      a { color: inherit; text-underline-offset: 3px; }
      .small { font-size: 0.875rem; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>This site is temporarily offline.</h1>
      <p>The page is being reworked and will be back shortly. Thanks for your patience.</p>
      <hr />
      <p class="small">Reach me at <a href="mailto:ruikai@umich.edu">ruikai@umich.edu</a>.</p>
    </main>
  </body>
</html>
