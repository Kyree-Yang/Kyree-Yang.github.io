    <script>
      // Theme boot: resolve before first paint so a hard reload never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle(
            'dark',
            stored ? stored === 'dark' : prefersDark,
          );
        } catch (e) {}
      })();
    </script>
    <script>
      // GitHub Pages SPA fallback: 404.html stashes the requested URL, this
      // replays it into the router. Same-origin check guards a redirect loop.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect.indexOf(location.origin) === 0 && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
